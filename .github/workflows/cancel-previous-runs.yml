name: Cancel Previous Runs

on:
  workflow_call: {}

jobs:
  cancel:
    runs-on: polaris
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            // `context.ref_name` does not exist on the github-script context (only `ref`
            // is exposed), so the old value was undefined and the branch filter below was
            // silently dropped: a run on dev cancelled in-flight runs on every branch,
            // including a prod deploy. Take the ref from the runner environment instead,
            // and refuse to continue without it rather than fall back to "all branches".
            const branch = process.env.GITHUB_REF_NAME;
            if (!branch) {
              core.setFailed('GITHUB_REF_NAME is empty; refusing to cancel runs without a branch scope');
              return;
            }

            // Resolve the calling workflow's ID via the API (workflow_ref is unreliable in workflow_call)
            const currentRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const workflowId = currentRun.data.workflow_id;

            core.info(`Cancelling previous runs of workflow ${workflowId} on branch ${branch}`);
            core.info(`Current run ID: ${context.runId} (will be excluded)`);

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: branch,
              per_page: 100,
            });

            const toCancel = runs.filter(run =>
              (run.status === 'in_progress' || run.status === 'queued') &&
              run.head_branch === branch &&
              run.id !== context.runId
            );

            core.info(`Found ${toCancel.length} run(s) to cancel`);

            for (const run of toCancel) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                core.info(`Cancelled run ${run.id} (status: ${run.status})`);
              } catch (err) {
                core.warning(`Could not cancel run ${run.id}: ${err.message}`);
              }
            }
